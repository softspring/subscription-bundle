# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# PHPMD is a spin-off project of PHP Depend and
# aims to be a PHP equivalent of the well known Java tool PMD.

name: Code Scanning

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]
    schedule:
        -   cron: '35 13 * * 4'

permissions:
    contents: read

jobs:
    PHPMD:
        name: Run PHPMD SARIF scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup PHP and PHPMD
                uses: shivammathur/setup-php@v2
                with:
                    coverage: none
                    tools: phpmd

            -   name: Run PHPMD
                run: phpmd src sarif .phpmd.xml.dist --reportfile phpmd-results.sarif
                continue-on-error: true

            -   name: Upload analysis results to GitHub
                if: always()
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: phpmd-results.sarif
                    wait-for-processing: true
